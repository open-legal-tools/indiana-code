[project]
name = "indiana-code"
version = "0.1.0"
description = "Dated, unofficial Indiana Code as a local MCP server (2017–2026)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Danielle Teagarden" }]
dependencies = ["mcp>=1.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
indiana-code = "indiana_law.mcp_server:main"
indiana-law = "indiana_law.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
